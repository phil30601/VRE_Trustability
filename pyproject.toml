[project]
name = "vre-trustability"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
    "matplotlib>=3.8,<4",
    "numpy==1.26.4",
    "pandas>=2.2,<3",
    "psutil>=5,<8",
    "pyarrow>=17,<22",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "tensorflow-rocm",
]

[tool.uv.sources]
tensorflow-rocm = { url = "https://repo.radeon.com/rocm/manylinux/rocm-rel-7.2.1/tensorflow_rocm-2.20.0.dev0%2Bselfbuilt-cp312-cp312-manylinux_2_28_x86_64.whl" }
